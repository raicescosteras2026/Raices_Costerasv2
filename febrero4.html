<!DOCTYPE html>
<meta charset="utf-8">
<script src="https://d3js.org/d3.v4.js"></script>

<style>
  body {
    font-family: Arial, sans-serif;
  }
  .extra-info {
    margin-top: 30px;
    margin-left: 300px;
    font-size: 16px;
    line-height: 1.6;
  }
  .extra-info h3 {
    margin-bottom: 10px;
    font-weight: normal;
  }
  
  /* Tooltip css */
  .tooltip {
    position: absolute;
    text-align: left;
    padding: 12px;
    font: 14px Arial, sans-serif;
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 8px;
    pointer-events: none;
    opacity: 0;
    box-shadow: 0px 4px 10px rgba(0,0,0,0.15);
    z-index: 10;
    max-width: 250px;
  }
  .tooltip strong {
    color: #333;
    display: block;
    margin-bottom: 6px;
  }
</style>

<div id="my_dataviz"></div>

<div class="extra-info">
  <h3>Priorización de Estrategias con<br>Líderes comunitarios</h3>
  <p>Febrero 4, 2026</p>
  <p>Participantes: 9</p>
  <p><strong>Preparado por:</strong> Proyecto Raíces Costeras, Un Nuevo Amanecer Inc.</p>
</div>

<script>
var margin = {top: 50, right: 30, bottom: 50, left: 300},
    width = 900 - margin.left - margin.right,
    height = 650 - margin.top - margin.bottom;

var svg = d3.select("#my_dataviz")
  .append("svg")
    .attr("width", width + margin.left + margin.right)
    .attr("height", height + margin.top + margin.bottom)
  .append("g")
    .attr("transform",
          "translate(" + margin.left + "," + margin.top + ")");

var data = [
  {Estrategia: "Reuniones Municipio-Líderes", Count: 4},
  {Estrategia: "Control desbordamiento cuerpos de agua", Count: 4},
  {Estrategia: "Alcantarillado sanitario y prevenir desbordes", Count: 4},
  {Estrategia: "Puerto de las Américas centro logístico", Count: 3},
  {Estrategia: "Protección de barreras naturales (manglares/arrecifes)", Count: 3},
  {Estrategia: "Orientación para fomentar la Participación activa en procesos de planificación", Count: 3},
  {Estrategia: "Iluminación y red eléctrica", Count: 3},
  {Estrategia: "Capacitación comunitaria respuesta y preparación ante desastres", Count: 3},
  {Estrategia: "Portal datos abiertos", Count: 2},
  {Estrategia: "Educación ambiental enfocada en limpieza y reciclaje", Count: 2},
  {Estrategia: "Reforestación urbana para reducir calor", Count: 1},
  {Estrategia: "Readaptación de Centros comunales como centros resiliencia", Count: 1},
  {Estrategia: "Micro-redes energía", Count: 1},
  {Estrategia: "Mejoras drenaje pluvial general", Count: 1},
  {Estrategia: "Floodproofing elevar o proteger vivienda", Count: 1},
  {Estrategia: "Ejecución Plan Mitigación", Count: 1},
  {Estrategia: "Educar las comunidades sobre los problemas que enfrentan", Count: 1},
  {Estrategia: "Drenaje específico Puerto Viejo", Count: 1},
  {Estrategia: "Creación de Pocket parks y Pequeñas Plazas en lotes baldíos", Count: 1},
  {Estrategia: "Ayudar familias de bajos recursos para mejorar sus hogares", Count: 1}
];

var x = d3.scaleLinear()
  .domain([0, 4])
  .range([ 0, width]);
  
svg.append("g")
  .attr("transform", "translate(0," + height + ")")
  .call(d3.axisBottom(x).ticks(4));

var y = d3.scaleBand()
  .range([ 0, height ])
  .domain(data.map(function(d) { return d.Estrategia; }))
  .padding(1); 
  
svg.append("g")
  .call(d3.axisLeft(y));

var tooltip = d3.select("body").append("div")
    .attr("class", "tooltip");

// Lines
svg.selectAll("myline")
  .data(data)
  .enter()
  .append("line")
    .attr("x1", x(0))
    .attr("x2", x(0))
    .attr("y1", function(d) { return y(d.Estrategia); })
    .attr("y2", function(d) { return y(d.Estrategia); })
    .attr("stroke", "grey");

// Animation for lines
svg.selectAll("line")
  .transition()
  .duration(1000)
  .attr("x1", function(d) { return x(d.Count); });

// Circles
svg.selectAll("mycircle")
  .data(data)
  .enter()
  .append("circle")
    .attr("cx", x(0))
    .attr("cy", function(d) { return y(d.Estrategia); })
    .attr("r", "7")
    .style("fill", "#619ed6")
    .attr("stroke", "black")
    .style("cursor", "pointer")
    .on("mouseover", function(d) {
      d3.select(this).transition().duration(200).style("fill", "#ff7f0e").attr("r", 10);
    })
    .on("mouseout", function(d) {
      d3.select(this).transition().duration(200).style("fill", "#619ed6").attr("r", 7);
      tooltip.transition().duration(500).style("opacity", 0);
    })
    .on("click", function(d) {
      tooltip.transition().duration(200).style("opacity", 1);
      tooltip.html("<strong>" + d.Estrategia + "</strong>Votos: " + d.Count)
             .style("left", (d3.event.pageX + 15) + "px")
             .style("top", (d3.event.pageY - 28) + "px");
    });

// Animation for circles
svg.selectAll("circle")
  .transition()
  .duration(1000)
  .attr("cx", function(d) { return x(d.Count); });

// Add labels at the end of the lollipops
svg.selectAll("myTextLabels")
  .data(data)
  .enter()
  .append("text")
  .attr("x", function(d) { return x(d.Count) + 15; }) 
  .attr("y", function(d) { return y(d.Estrategia) + 4; })
  .text(function(d) { return d.Count; })
  .attr("fill", "black")
  .attr("font-family", "Arial")
  .attr("font-size", "12px")
  .attr("font-weight", "bold")
  .style("opacity", 0)
  .transition()
  .delay(1000)
  .duration(500)
  .style("opacity", 1);

svg.append("text")
  .attr("x", 0)
  .attr("y", -20)
  .style("font-size", "20px")
  .text("Conteo Total de Estrategias");

svg.append("text")
  .attr("x", width / 2)
  .attr("y", height + 40)
  .style("text-anchor", "middle")
  .style("font-size", "14px")
  .text("Cantidad (Count)");

svg.append("text")
  .attr("transform", "rotate(-90)")
  .attr("y", -margin.left + 20)
  .attr("x", 0 - (height / 2))
  .style("text-anchor", "middle")
  .style("font-size", "16px")
  .text("Estrategia");

</script>
