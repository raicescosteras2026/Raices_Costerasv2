<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://d3js.org/d3.v4.js"></script>

<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 10px;
  }
  .chart-container {
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    overflow: visible;
  }
  .extra-info {
    margin-top: 20px;
    font-size: 18px;
    line-height: 1.6;
    color: #4a4a4a;
    padding: 0 10px;
    max-width: 1100px;
    margin-left: auto;
    margin-right: auto;
  }
  
  /* Desktop alignment */
  @media (min-width: 768px) {
    .extra-info {
      margin-top: 30px;
      padding-left: 450px;
    }
  }

  .extra-info h2 {
    font-size: 28px;
    margin-bottom: 5px;
    color: #333;
    font-weight: normal;
  }
  
  /* Tooltip css */
  .tooltip {
    position: absolute;
    text-align: left;
    padding: 12px;
    font: 14px Arial, sans-serif;
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 8px;
    pointer-events: none;
    opacity: 0;
    box-shadow: 0px 4px 10px rgba(0,0,0,0.15);
    z-index: 10;
    max-width: 250px;
  }
  .tooltip strong {
    color: #333;
    display: block;
    margin-bottom: 6px;
  }
</style>
</head>
<body>

<div class="chart-container" id="my_dataviz"></div>

<div class="extra-info">
  <h2>Votos: 27</h2>
  <p>Junio 3, 2026</p>
  <p style="font-size: 24px; margin-bottom: 5px;">Raíces Costeras</p>
</div>

<script>
var margin = {top: 70, right: 50, bottom: 50, left: 450},
    width = 1100 - margin.left - margin.right,
    height = 1200 - margin.top - margin.bottom; 

var svg = d3.select("#my_dataviz")
  .append("svg")
    .attr("viewBox", `0 0 ${width + margin.left + margin.right} ${height + margin.top + margin.bottom}`)
    .attr("preserveAspectRatio", "xMinYMin meet")
    .style("width", "100%")
    .style("height", "auto")
  .append("g")
    .attr("transform", "translate(" + margin.left + "," + margin.top + ")");

var data = [
    {Estrategia: "Crear una red de apoyo vecinal para promover la comunicación y monitorear población vulnerable antes, durante y después de emergencias. La red tendrá un doble propósito: establecer un sistema efectivo de comunicación y organizar el acompañamiento y monitoreo de las personas más vulnerables", Count: 7},
    {Estrategia: "Establecer un Plan de Respuesta Comunitaria ante emergencias, con puntos de encuentro, contactos clave, capacitación de primeros auxilios y protocolos incluyendo ciclos de simulacros de emergencia tomando en consideración a personas mayores y con movilidad reducida", Count: 5},
    {Estrategia: "Establecer un mecanismo organizacional para darle seguimiento a las nuevas iniciativas de resiliencia comunitaria y atender nuevas. La comunidad enfrenta riesgos severos como inundaciones, tsunamis, terremotos y el deterioro de infraestructura esencial, cual requiere una respuesta planificada y continua.", Count: 4},
    {Estrategia: "Realizar un registro voluntario para identificar los recursos disponibles entre los vecinos, así como las vulnerabilidades en las viviendas y las necesidades particulares en la población. Permitirá conocer fortalezas como habilidades especializadas y equipos disponibles.", Count: 2},
    {Estrategia: "Revisar y abogar por la actualización de las rutas de desalojo, la señalización de la ruta y el sistema de alarma oficial en caso de eventos de emergencias. Permitirá identificar y corregir deficiencias, mejorar la visibilidad de las rutas y asegurar su accesibilidad.", Count: 2},
    {Estrategia: "Coordinar el funcionamiento de las bombas de agua, para controlar las inundaciones urbanas, y abogar por la realización de un análisis de capacidad de la infraestructura. Un manejo efectivo permitirá una respuesta rápida y controlada ante lluvias intensas", Count: 1},
    {Estrategia: "Crear una salida vehicular de emergencia para los residentes del área de Villa del Carmen. Se propone explorar junto al Municipio de Ponce y las agencias pertinentes la creación de una salida de emergencias vehicular para casos en que la Ave. Caribe quede intransitable", Count: 1},
    {Estrategia: "Establecer espacios verdes en el entorno urbano mediante un Programa de Huertos Urbano en el que participen escuelas e iglesias de la comunidad. Ayudarían a mitigar los efectos del cambio climático y revitalizar áreas abandonadas.", Count: 1},
    {Estrategia: "Estrategia para fortalecer la economía local y garantizar su recuperación tras desastres naturales, proporcionando un respaldo económico inmediato para cubrir gastos imprevistos y reparar daños.", Count: 1},
    {Estrategia: "Gestionar cursos de formación en oficios locales (carpintería, electricidad, costura, cocina, entre otros) para ampliar las oportunidades laborales. Brinda a los residentes habilidades prácticas para mejorar viviendas y generar ingresos.", Count: 1},
    {Estrategia: "Mejorar la seguridad jurídica residencial de las familias mediante la coordinación de proceso de orientación a la comunidad en asuntos de vivienda: titularidad, tenencia, impuesto sobre la propiedad, derechos, entre otros temas", Count: 1},
    {Estrategia: "Se propone abogar porque el Municipio de Ponce implemente un Plan de Mejoramiento Peatonal como estrategia clave para garantizar la movilidad segura de residentes, especialmente personas mayores y con discapacidad. Incluye arborización para mitigar el calor extremo.", Count: 1}
];

var x = d3.scaleLinear()
  .domain([0, 8]) 
  .range([ 0, width]);
  
svg.append("g")
  .attr("transform", "translate(0," + height + ")")
  .call(d3.axisBottom(x).ticks(8));

var y = d3.scaleBand()
  .range([ 0, height ])
  .domain(data.map(function(d) { return d.Estrategia; }))
  .padding(1);
  
svg.append("g")
  .call(d3.axisLeft(y))
  .selectAll(".tick text")
  .call(wrap, margin.left - 20);

var tooltip = d3.select("body").append("div")
    .attr("class", "tooltip");

// Lines
svg.selectAll("myline")
  .data(data)
  .enter()
  .append("line")
    .attr("x1", x(0))
    .attr("x2", x(0))
    .attr("y1", function(d) { return y(d.Estrategia); })
    .attr("y2", function(d) { return y(d.Estrategia); })
    .attr("stroke", "grey");

// Animation for lines
svg.selectAll("line")
  .transition()
  .duration(1000)
  .attr("x1", function(d) { return x(d.Count); });

// Circles
svg.selectAll("mycircle")
  .data(data)
  .enter()
  .append("circle")
    .attr("cx", x(0))
    .attr("cy", function(d) { return y(d.Estrategia); })
    .attr("r", "7")
    .style("fill", "#f64c54") 
    .attr("stroke", "black")
    .style("cursor", "pointer")
    .on("mouseover", function(d) {
      d3.select(this).transition().duration(200).style("fill", "#ff7f0e").attr("r", 10);
    })
    .on("mouseout", function(d) {
      d3.select(this).transition().duration(200).style("fill", "#f64c54").attr("r", 7);
      tooltip.transition().duration(500).style("opacity", 0);
    })
    .on("click", function(d) {
      tooltip.transition().duration(200).style("opacity", 1);
      tooltip.html("<strong>" + d.Estrategia + "</strong>Votos: " + d.Count)
             .style("left", (d3.event.pageX + 15) + "px")
             .style("top", (d3.event.pageY - 28) + "px");
    })
    .on("touchstart", function(d) {
      d3.event.preventDefault(); 
      tooltip.transition().duration(200).style("opacity", 1);
      tooltip.html("<strong>" + d.Estrategia + "</strong>Votos: " + d.Count)
             .style("left", (d3.event.touches[0].pageX + 15) + "px")
             .style("top", (d3.event.touches[0].pageY - 28) + "px");
    });

// Close tooltip when clicking outside
d3.select("body").on("touchstart", function() {
   if(d3.event.target.tagName !== "circle") {
       tooltip.transition().duration(500).style("opacity", 0);
   }
});

// Animation for circles
svg.selectAll("circle")
  .transition()
  .duration(1000)
  .attr("cx", function(d) { return x(d.Count); });

// Add labels at the end of the lollipops
svg.selectAll("myTextLabels")
  .data(data)
  .enter()
  .append("text")
  .attr("x", function(d) { return x(d.Count) + 15; }) 
  .attr("y", function(d) { return y(d.Estrategia) + 4; })
  .text(function(d) { return d.Count; })
  .attr("fill", "black")
  .attr("font-family", "Arial")
  .attr("font-size", "12px")
  .attr("font-weight", "bold")
  .style("opacity", 0)
  .transition()
  .delay(1000)
  .duration(500)
  .style("opacity", 1);

// Add Chart Title
svg.append("text")
  .attr("x", -margin.left + 20)
  .attr("y", -45)
  .style("font-size", "22px")
  .style("fill", "#333")
  .text("Resultados Priorización Acciones de Resiliencia");
  
// Add Subtitle Header above the Y-axis labels
svg.append("text")
  .attr("x", -20)
  .attr("y", -10)
  .style("text-anchor", "end")
  .style("font-size", "12px")
  .style("font-weight", "bold")
  .text("Acciones ☰");

// Text wrapping function for long Y-axis category names
function wrap(text, width) {
  text.each(function() {
    var text = d3.select(this),
        words = text.text().split(/\s+/).reverse(),
        word,
        line = [],
        lineNumber = 0,
        lineHeight = 1.1, // ems
        y = text.attr("y"),
        dy = parseFloat(text.attr("dy") || 0),
        tspan = text.text(null).append("tspan").attr("x", -10).attr("y", y).attr("dy", dy + "em");
    while (word = words.pop()) {
      line.push(word);
      tspan.text(line.join(" "));
      if (tspan.node().getComputedTextLength() > width) {
        line.pop();
        tspan.text(line.join(" "));
        line = [word];
        tspan = text.append("tspan").attr("x", -10).attr("y", y).attr("dy", ++lineNumber * lineHeight + dy + "em").text(word);
      }
    }
    // Adjust vertical alignment to center multi-line text block
    var offset = (lineNumber * lineHeight) / 2;
    text.attr("transform", "translate(0, " + -offset + "em)");
  });
}
</script>
</body>
</html>
