<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://d3js.org/d3.v4.js"></script>

<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 10px;
  }
  .chart-container {
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    overflow: visible;
  }
  .extra-info {
    margin-top: 20px;
    font-size: 18px;
    line-height: 1.6;
    color: #4a4a4a;
    padding: 0 10px;
    max-width: 1100px;
    margin-left: auto;
    margin-right: auto;
  }
  
  /* Desktop alignment */
  @media (min-width: 768px) {
    .extra-info {
      margin-top: 30px;
      padding-left: 450px;
    }
  }

  .extra-info h2 {
    font-size: 28px;
    margin-bottom: 5px;
    color: #333;
    font-weight: normal;
  }
  
  /* Tooltip css */
  .tooltip {
    position: absolute;
    text-align: left;
    padding: 12px;
    font: 14px Arial, sans-serif;
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 8px;
    pointer-events: none;
    opacity: 0;
    box-shadow: 0px 4px 10px rgba(0,0,0,0.15);
    z-index: 10;
    max-width: 250px;
  }
  .tooltip strong {
    color: #333;
    display: block;
    margin-bottom: 6px;
  }
</style>
</head>
<body>

<div class="chart-container" id="my_dataviz"></div>

<div class="extra-info">
  <h2>Votos: 127</h2>
  <p>Abril 8, 2026</p>
  <p style="font-size: 24px; margin-bottom: 5px;">Raíces Costeras</p>
</div>

<script>
var margin = {top: 70, right: 50, bottom: 50, left: 450},
    width = 1100 - margin.left - margin.right,
    height = 800 - margin.top - margin.bottom; 

var svg = d3.select("#my_dataviz")
  .append("svg")
    .attr("viewBox", `0 0 ${width + margin.left + margin.right} ${height + margin.top + margin.bottom}`)
    .attr("preserveAspectRatio", "xMinYMin meet")
    .style("width", "100%")
    .style("height", "auto")
  .append("g")
    .attr("transform", "translate(" + margin.left + "," + margin.top + ")");

var data = [
    {Estrategia: "Establecer alianzas con clínicas locales para ferias de salud preventivas", Count: 28},
    {Estrategia: "Crear un programa de visitas a hogares para adultos mayores", Count: 24},
    {Estrategia: "Distribución de kits de primeros auxilios y medicamentos básicos", Count: 21},
    {Estrategia: "Talleres de nutrición y manejo de enfermedades crónicas (diabetes, hipertensión)", Count: 18},
    {Estrategia: "Coordinar transporte comunitario para citas médicas", Count: 15},
    {Estrategia: "Campaña de vacunación y prevención de enfermedades transmitidas por mosquitos", Count: 12},
    {Estrategia: "Capacitación en salud mental y primeros auxilios psicológicos", Count: 9}
];

var x = d3.scaleLinear()
  .domain([0, 30]) 
  .range([ 0, width]);
  
svg.append("g")
  .attr("transform", "translate(0," + height + ")")
  .call(d3.axisBottom(x).ticks(6));

var y = d3.scaleBand()
  .range([ 0, height ])
  .domain(data.map(function(d) { return d.Estrategia; }))
  .padding(1);
  
svg.append("g")
  .call(d3.axisLeft(y))
  .selectAll(".tick text")
  .call(wrap, margin.left - 20);

var tooltip = d3.select("body").append("div")
    .attr("class", "tooltip");

// Lines
svg.selectAll("myline")
  .data(data)
  .enter()
  .append("line")
    .attr("x1", x(0))
    .attr("x2", x(0))
    .attr("y1", function(d) { return y(d.Estrategia); })
    .attr("y2", function(d) { return y(d.Estrategia); })
    .attr("stroke", "grey");

// Animation for lines
svg.selectAll("line")
  .transition()
  .duration(1000)
  .attr("x1", function(d) { return x(d.Count); });

// Circles
svg.selectAll("mycircle")
  .data(data)
  .enter()
  .append("circle")
    .attr("cx", x(0))
    .attr("cy", function(d) { return y(d.Estrategia); })
    .attr("r", "7")
    .style("fill", "#f64c54") 
    .attr("stroke", "black")
    .style("cursor", "pointer")
    .on("mouseover", function(d) {
      d3.select(this).transition().duration(200).style("fill", "#ff7f0e").attr("r", 10);
    })
    .on("mouseout", function(d) {
      d3.select(this).transition().duration(200).style("fill", "#f64c54").attr("r", 7);
      tooltip.transition().duration(500).style("opacity", 0);
    })
    .on("click", function(d) {
      tooltip.transition().duration(200).style("opacity", 1);
      tooltip.html("<strong>" + d.Estrategia + "</strong>Votos: " + d.Count)
             .style("left", (d3.event.pageX + 15) + "px")
             .style("top", (d3.event.pageY - 28) + "px");
    })
    .on("touchstart", function(d) {
      d3.event.preventDefault(); 
      tooltip.transition().duration(200).style("opacity", 1);
      tooltip.html("<strong>" + d.Estrategia + "</strong>Votos: " + d.Count)
             .style("left", (d3.event.touches[0].pageX + 15) + "px")
             .style("top", (d3.event.touches[0].pageY - 28) + "px");
    });

// Close tooltip when clicking outside
d3.select("body").on("touchstart", function() {
   if(d3.event.target.tagName !== "circle") {
       tooltip.transition().duration(500).style("opacity", 0);
   }
});

// Animation for circles
svg.selectAll("circle")
  .transition()
  .duration(1000)
  .attr("cx", function(d) { return x(d.Count); });

// Add labels at the end of the lollipops
svg.selectAll("myTextLabels")
  .data(data)
  .enter()
  .append("text")
  .attr("x", function(d) { return x(d.Count) + 15; }) 
  .attr("y", function(d) { return y(d.Estrategia) + 4; })
  .text(function(d) { return d.Count; })
  .attr("fill", "black")
  .attr("font-family", "Arial")
  .attr("font-size", "12px")
  .attr("font-weight", "bold")
  .style("opacity", 0)
  .transition()
  .delay(1000)
  .duration(500)
  .style("opacity", 1);

// Add Chart Title
svg.append("text")
  .attr("x", -margin.left + 20)
  .attr("y", -45)
  .style("font-size", "22px")
  .style("fill", "#333")
  .text("Conteo de Estrategias de Salud");
  
svg.append("text")
  .attr("x", -margin.left + 20)
  .attr("y", -20)
  .style("font-size", "14px")
  .style("fill", "#666")
  .text("Frecuencia de selección por estrategia");

// Add Subtitle Header above the Y-axis labels
svg.append("text")
  .attr("x", -20)
  .attr("y", -10)
  .style("text-anchor", "end")
  .style("font-size", "12px")
  .style("font-weight", "bold")
  .text("Estrategias ☰");

// Text wrapping function for long Y-axis category names
function wrap(text, width) {
  text.each(function() {
    var text = d3.select(this),
        words = text.text().split(/\s+/).reverse(),
        word,
        line = [],
        lineNumber = 0,
        lineHeight = 1.1, // ems
        y = text.attr("y"),
        dy = parseFloat(text.attr("dy") || 0),
        tspan = text.text(null).append("tspan").attr("x", -10).attr("y", y).attr("dy", dy + "em");
    while (word = words.pop()) {
      line.push(word);
      tspan.text(line.join(" "));
      if (tspan.node().getComputedTextLength() > width) {
        line.pop();
        tspan.text(line.join(" "));
        line = [word];
        tspan = text.append("tspan").attr("x", -10).attr("y", y).attr("dy", ++lineNumber * lineHeight + dy + "em").text(word);
      }
    }
    // Adjust vertical alignment to center multi-line text block
    var offset = (lineNumber * lineHeight) / 2;
    text.attr("transform", "translate(0, " + -offset + "em)");
  });
}
</script>
</body>
</html>
