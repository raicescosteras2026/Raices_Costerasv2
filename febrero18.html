<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://d3js.org/d3.v4.js"></script>

<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 10px;
  }
  .chart-container {
    width: 100%;
    max-width: 1100px; /* Adjusting max-width because strategy text here is very long */
    margin: 0 auto;
    overflow: visible;
  }
  .extra-info {
    margin-top: 20px;
    font-size: 18px;
    line-height: 1.6;
    color: #4a4a4a;
    padding: 0 10px;
    max-width: 1100px;
    margin-left: auto;
    margin-right: auto;
  }
  
  /* Desktop alignment */
  @media (min-width: 768px) {
    .extra-info {
      margin-top: 30px;
      padding-left: 450px; /* Aligned with the chart's exceptionally long left margin */
    }
  }

  .extra-info h2 {
    font-size: 28px;
    margin-bottom: 5px;
    color: #333;
    font-weight: normal;
  }
  
  /* Tooltip css */
  .tooltip {
    position: absolute;
    text-align: left;
    padding: 12px;
    font: 14px Arial, sans-serif;
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 8px;
    pointer-events: none;
    opacity: 0;
    box-shadow: 0px 4px 10px rgba(0,0,0,0.15);
    z-index: 10;
    max-width: 250px;
  }
  .tooltip strong {
    color: #333;
    display: block;
    margin-bottom: 6px;
  }
</style>
</head>
<body>

<div class="chart-container" id="my_dataviz"></div>

<div class="extra-info">
  <h2>Participantes: 7</h2>
  <h2>Votos: 24</h2>
  <p>Febrero 18, 2026</p>
  <p style="font-size: 24px; margin-bottom: 5px;">Raíces Costeras</p>
</div>

<script>
var margin = {top: 50, right: 50, bottom: 50, left: 450},
    width = 1100 - margin.left - margin.right,
    height = 1100 - margin.top - margin.bottom;

var svg = d3.select("#my_dataviz")
  .append("svg")
    .attr("viewBox", `0 0 ${width + margin.left + margin.right} ${height + margin.top + margin.bottom}`)
    .attr("preserveAspectRatio", "xMinYMin meet")
    .style("width", "100%")
    .style("height", "auto")
  .append("g")
    .attr("transform", "translate(" + margin.left + "," + margin.top + ")");

var data = [
  {Estrategia: "Mantenimiento, actualización y rotulación de rutas de desalojo", Count: 3},
  {Estrategia: "Poder difundir planes de desalojo necesarios ante un evento de desastre.", Count: 2},
  {Estrategia: "Orientar a la ciudadanía en cuanto a la necesidad de que tomen parte activa en la planificación y respuesta ante un desastre natural, para estar preparados y minimizar pérdidas de vida y propiedad.", Count: 2},
  {Estrategia: "Identificar Edificios que puedan servir como centros de resiliencia", Count: 2},
  {Estrategia: "Establecer para cada comunidad las rutas viales primarias y alternas más adecuadas, seguras y efectivas, que le permita a la administración responder a una emergencia.", Count: 2},
  {Estrategia: "Establecer alianzas con el gobierno central, municipio, y la empresa privada, para responder a la necesidad de las comunidades en caso de que los servicios básicos de agua, energía, comunicaciones y salud no estén disponibles dura..", Count: 2},
  {Estrategia: "Validar los Planes Operacionales de Emergencias existentes en el municipio, a través de ejercicios funcionales a nivel comunal y gobierno local, y a gran escala con las Agencias de Apoyo del gobierno estatal y federal.", Count: 1},
  {Estrategia: "Simulacros para estar preparados", Count: 1},
  {Estrategia: "Rescatar escuela Eugenio Maria de Hostos para refugio", Count: 1},
  {Estrategia: "Rehabilitar estaciones de bombeo y mejorar drenaje", Count: 1},
  {Estrategia: "Poner a la disposición de la ciudadanía lugares seguros y accesibles, para ser utilizados como refugios, habilitados para suplir las necesidades esenciales de seguridad y de alimentación.", Count: 1},
  {Estrategia: "Organizar las comunidades para que sepan cómo responder primariamente ante un desastre natural de gran envergadura.", Count: 1},
  {Estrategia: "fomentar orientacion para fomentar la participacion activa en procesos de planificacion ante emergencias", Count: 1},
  {Estrategia: "Fomentar el que cada familia mantenga un botiquín de primeros auxilios accesible.", Count: 1},
  {Estrategia: "Establecer Reuniones Periodicas entre Municipio y Lideres Comunitarios", Count: 1},
  {Estrategia: "Establecer alianzas con entidades locales para el desarrollo de un plan de emergencia inclusivo.", Count: 1},
  {Estrategia: "Desarrollar un Plan de Emergencia dirigido a atender el desalojo de adultos mayores y otras poblaciones vulnerables", Count: 1}
];

var x = d3.scaleLinear()
  .domain([0, 4]) 
  .range([ 0, width]);
  
svg.append("g")
  .attr("transform", "translate(0," + height + ")")
  .call(d3.axisBottom(x).ticks(4));

var y = d3.scaleBand()
  .range([ 0, height ])
  .domain(data.map(function(d) { return d.Estrategia; }))
  .padding(1);
  
svg.append("g")
  .call(d3.axisLeft(y))
  .selectAll(".tick text")
  .call(wrap, margin.left - 20); // Helper function to wrap exceptionally long text labels

var tooltip = d3.select("body").append("div")
    .attr("class", "tooltip");

// Lines
svg.selectAll("myline")
  .data(data)
  .enter()
  .append("line")
    .attr("x1", x(0))
    .attr("x2", x(0))
    .attr("y1", function(d) { return y(d.Estrategia); })
    .attr("y2", function(d) { return y(d.Estrategia); })
    .attr("stroke", "grey");

// Animation for lines
svg.selectAll("line")
  .transition()
  .duration(1000)
  .attr("x1", function(d) { return x(d.Count); });

// Circles
svg.selectAll("mycircle")
  .data(data)
  .enter()
  .append("circle")
    .attr("cx", x(0))
    .attr("cy", function(d) { return y(d.Estrategia); })
    .attr("r", "7")
    .style("fill", "#f64c54") // Coral red color matching the image
    .attr("stroke", "black")
    .style("cursor", "pointer")
    .on("mouseover", function(d) {
      d3.select(this).transition().duration(200).style("fill", "#ff7f0e").attr("r", 10);
    })
    .on("mouseout", function(d) {
      d3.select(this).transition().duration(200).style("fill", "#f64c54").attr("r", 7);
      tooltip.transition().duration(500).style("opacity", 0);
    })
    .on("click", function(d) {
      tooltip.transition().duration(200).style("opacity", 1);
      tooltip.html("<strong>" + d.Estrategia + "</strong>Votos: " + d.Count + " (" + ((d.Count / 24) * 100).toFixed(1) + "%)")
             .style("left", (d3.event.pageX + 15) + "px")
             .style("top", (d3.event.pageY - 28) + "px");
    })
    .on("touchstart", function(d) {
      d3.event.preventDefault(); // Prevents touch from double firing
      tooltip.transition().duration(200).style("opacity", 1);
      tooltip.html("<strong>" + d.Estrategia + "</strong>Votos: " + d.Count + " (" + ((d.Count / 24) * 100).toFixed(1) + "%)")
             .style("left", (d3.event.touches[0].pageX + 15) + "px")
             .style("top", (d3.event.touches[0].pageY - 28) + "px");
    });

// Close tooltip when clicking outside
d3.select("body").on("touchstart", function() {
   if(d3.event.target.tagName !== "circle") {
       tooltip.transition().duration(500).style("opacity", 0);
   }
});

// Animation for circles
svg.selectAll("circle")
  .transition()
  .duration(1000)
  .attr("cx", function(d) { return x(d.Count); });

// Add labels at the end of the lollipops
svg.selectAll("myTextLabels")
  .data(data)
  .enter()
  .append("text")
  .attr("x", function(d) { return x(d.Count) + 15; }) 
  .attr("y", function(d) { return y(d.Estrategia) + 4; })
  .text(function(d) { return d.Count; })
  .attr("fill", "black")
  .attr("font-family", "Arial")
  .attr("font-size", "12px")
  .attr("font-weight", "bold")
  .style("opacity", 0)
  .transition()
  .delay(1000)
  .duration(500)
  .style("opacity", 1);

// Add Chart Title
svg.append("text")
  .attr("x", -margin.left + 20)
  .attr("y", -30)
  .style("font-size", "22px")
  .style("fill", "#333")
  .text("Resultados Priorización Estrategias de Emergencias");

// Add Subtitle Header above the Y-axis labels
svg.append("text")
  .attr("x", -20)
  .attr("y", -10)
  .style("text-anchor", "end")
  .style("font-size", "12px")
  .style("font-weight", "bold")
  .text("Estrategias ☰");

// Text wrapping function for long Y-axis category names
function wrap(text, width) {
  text.each(function() {
    var text = d3.select(this),
        words = text.text().split(/\s+/).reverse(),
        word,
        line = [],
        lineNumber = 0,
        lineHeight = 1.1, // ems
        y = text.attr("y"),
        dy = parseFloat(text.attr("dy") || 0),
        tspan = text.text(null).append("tspan").attr("x", -10).attr("y", y).attr("dy", dy + "em");
    while (word = words.pop()) {
      line.push(word);
      tspan.text(line.join(" "));
      if (tspan.node().getComputedTextLength() > width) {
        line.pop();
        tspan.text(line.join(" "));
        line = [word];
        tspan = text.append("tspan").attr("x", -10).attr("y", y).attr("dy", ++lineNumber * lineHeight + dy + "em").text(word);
      }
    }
    // Adjust vertical alignment to center multi-line text block
    var offset = (lineNumber * lineHeight) / 2;
    text.attr("transform", "translate(0, " + -offset + "em)");
  });
}
</script>
</body>
</html>
