<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking de Estrategias - Lollipop Chart</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --text-main: #1a1a1a;
            --text-muted: #555;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .dashboard-container {
            width: 100%;
            max-width: 1200px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        /* Header Layout */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
        }

        .title-group h1 {
            font-size: 1.4rem;
            color: var(--text-muted);
            margin: 0 0 10px 0;
            font-weight: 500;
        }

        .meta-group {
            text-align: right;
        }

        .meta-group h2 {
            font-size: 1.6rem;
            margin: 0 0 5px 0;
            font-weight: 600;
        }

        .meta-group h3 {
            font-size: 1.4rem;
            margin: 0 0 5px 0;
            font-weight: 500;
        }

        .meta-group p {
            font-size: 1.2rem;
            margin: 0;
            color: var(--text-muted);
        }

        /* Chart Area */
        #chart-container {
            width: 100%;
            position: relative;
        }

        /* Tooltip styling */
        .tooltip {
            position: absolute;
            text-align: left;
            padding: 12px;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            border-radius: 6px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            max-width: 300px;
            z-index: 10;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* Footer Stats Area */
        .footer-stats {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }

        .stats-box p {
            font-size: 1.3rem;
            margin: 5px 0;
            font-weight: 500;
        }

        .preparer {
            font-size: 1.3rem;
            font-weight: 500;
            text-align: right;
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            .header, .footer-stats {
                flex-direction: column;
                align-items: flex-start;
            }
            .meta-group, .preparer {
                text-align: left;
                margin-top: 15px;
            }
            .dashboard-container {
                padding: 15px;
            }
        }

        /* SVG text styling */
        .y-axis text {
            font-size: 12px;
            fill: #333;
        }
        .x-axis text {
            font-size: 14px;
            font-weight: bold;
        }
        .x-axis-label {
            font-size: 12px;
            fill: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    
    <div class="header">
        <div class="title-group">
            <h1>Ranking de Estrategias por Cantidad de Votos</h1>
        </div>
        <div class="meta-group">
            <h2>Ejercicio: Aplicar Criterios a Estrategias 25-04-2026</h2>
            <h3>Un Nuevo Amanecer</h3>
            <p>Marzo 24, 2026</p>
        </div>
    </div>

    <div id="chart-container">
        <div class="tooltip" id="tooltip"></div>
    </div>

    <div class="footer-stats">
        <div class="stats-box">
            <p>Participantes: N=8</p>
            <p>Total Estrategias: 7</p>
            <p>Total Respuestas (Criterios): 214</p>
        </div>
        <div class="preparer">
            Preparado por: Julián Salcedo
        </div>
    </div>

</div>

<script>
    // 1. Dataset extracted from image
    const data = [
        { id: 1, text: "Identificar edificios que puedan servir como centros de resiliencia", votes: 36, color: "#61c2c5" },
        { id: 2, text: "Establecer alianzas con el gobierno central, municipio y la empresa privada, para responder a la necesidad de las comunidades en caso de que los servicios básicos de agua, energía, comunicaciones y salud no", votes: 34, color: "#f27623" },
        { id: 3, text: "Establecer para cada comunidad las rutas viales primarias y alternas más adecuadas, seguras y efectivas, que le permita a la administración responder a una emergencia.", votes: 33, color: "#56a251" },
        { id: 4, text: "Mantenimiento, actualización y rotulación de rutas de desalojo", votes: 30, color: "#f6b835" },
        { id: 5, text: "Simulacros para estar preparados", votes: 30, color: "#f6b835" },
        { id: 6, text: "Orientar a la ciudadanía en cuanto a la necesidad de que tomen parte activa en la planificación y respuesta ante un desastre natural, para estar preparados y minimizar pérdidas de vida y propiedad.", votes: 26, color: "#db4f43" },
        { id: 7, text: "Poder difundir planes de desalojo necesarios ante un evento de desastre.", votes: 25, color: "#5582f6" }
    ];

    // 2. Set up dimensions (using viewBox for responsiveness)
    const margin = {top: 20, right: 60, bottom: 60, left: 320};
    const width = 1100 - margin.left - margin.right;
    const height = 600 - margin.top - margin.bottom;

    // 3. Append SVG object
    const svg = d3.select("#chart-container")
        .append("svg")
        .attr("viewBox", `0 0 ${width + margin.left + margin.right} ${height + margin.top + margin.bottom}`)
        .attr("preserveAspectRatio", "xMidYMid meet")
        .style("width", "100%")
        .style("height", "auto")
        .append("g")
        .attr("transform", `translate(${margin.left},${margin.top})`);

    // 4. Scales & Axes
    const x = d3.scaleLinear()
        .domain([0, 40])
        .range([0, width]);

    const y = d3.scaleBand()
        .range([0, height])
        .domain(data.map(d => d.text))
        .padding(1); // Padding 1 creates the center line for lollipops

    // Add X axis
    svg.append("g")
        .attr("transform", `translate(0, ${height})`)
        .attr("class", "x-axis")
        .call(d3.axisBottom(x).ticks(5).tickSizeOuter(0))
        .call(g => g.select(".domain").remove()) // Remove main axis line for cleaner look
        .call(g => g.selectAll(".tick line")
            .attr("y2", -height)
            .attr("stroke-opacity", 0.1) // Add faint gridlines
        );

    // X axis label
    svg.append("text")
        .attr("class", "x-axis-label")
        .attr("text-anchor", "middle")
        .attr("x", width / 2)
        .attr("y", height + 40)
        .text("Total de Votos (Criterios Seleccionados)");

    // Y axis Title
    svg.append("text")
        .attr("text-anchor", "end")
        .attr("x", -10)
        .attr("y", -10)
        .style("font-size", "12px")
        .style("fill", "#555")
        .text("Estrategia");

    // Add Y axis and wrap text
    const yAxis = svg.append("g")
        .attr("class", "y-axis")
        .call(d3.axisLeft(y).tickSizeOuter(0))
        .call(g => g.select(".domain").remove());

    // Apply text wrapping to Y axis labels
    yAxis.selectAll(".tick text")
        .call(wrapText, margin.left - 20);

    // 5. Tooltip setup
    const tooltip = d3.select("#tooltip");

    const mouseover = function(event, d) {
        tooltip.style("opacity", 1);
        d3.select(this)
            .transition().duration(200)
            .attr("r", 12)
            .attr("stroke", "#333")
            .attr("stroke-width", 2);
    }

    const mousemove = function(event, d) {
        tooltip.html(`<strong>Votos: ${d.votes}</strong><br><br><span style="font-size:12px">${d.text}</span>`)
            // Position near cursor but keep inside container bounds
            .style("left", (event.pageX + 15) + "px")
            .style("top", (event.pageY - 20) + "px");
    }

    const mouseleave = function(event, d) {
        tooltip.style("opacity", 0);
        d3.select(this)
            .transition().duration(200)
            .attr("r", 9)
            .attr("stroke", "none");
    }

    // 6. Draw Lollipop Lines
    svg.selectAll("myline")
        .data(data)
        .join("line")
        .attr("x1", x(0))
        .attr("x2", x(0)) // Start at 0 for animation
        .attr("y1", d => y(d.text))
        .attr("y2", d => y(d.text))
        .attr("stroke", d => d.color)
        .attr("stroke-width", "4px")
        // Animation
        .transition()
        .duration(1000)
        .attr("x2", d => x(d.votes));

    // 7. Draw Lollipop Circles
    svg.selectAll("mycircle")
        .data(data)
        .join("circle")
        .attr("cx", x(0)) // Start at 0 for animation
        .attr("cy", d => y(d.text))
        .attr("r", 9)
        .style("fill", d => d.color)
        .style("cursor", "pointer")
        .on("mouseover", mouseover)
        .on("mousemove", mousemove)
        .on("mouseleave", mouseleave)
        // Animation
        .transition()
        .duration(1000)
        .attr("cx", d => x(d.votes));

    // 8. Add Vote Numbers inside/next to circles
    svg.selectAll("mytext")
        .data(data)
        .join("text")
        .attr("x", x(0)) // Start at 0 for animation
        .attr("y", d => y(d.text))
        .attr("dy", "0.35em") // vertical alignment
        .attr("dx", "-15px") // slight offset left of the circle
        .style("fill", "white")
        .style("font-size", "11px")
        .style("font-weight", "bold")
        .style("pointer-events", "none") // prevent interfering with circle hover
        .text(d => d.votes)
        // Animation
        .transition()
        .duration(1000)
        .attr("x", d => x(d.votes));

    // Helper Function: Text wrapping for SVG
    function wrapText(text, width) {
        text.each(function() {
            let text = d3.select(this),
                words = text.text().split(/\s+/).reverse(),
                word,
                line = [],
                lineNumber = 0,
                lineHeight = 1.1, // ems
                y = text.attr("y") || 0,
                dy = parseFloat(text.attr("dy") || 0),
                tspan = text.text(null).append("tspan").attr("x", -10).attr("y", y).attr("dy", dy + "em");
            
            while (word = words.pop()) {
                line.push(word);
                tspan.text(line.join(" "));
                if (tspan.node().getComputedTextLength() > width) {
                    line.pop();
                    tspan.text(line.join(" "));
                    line = [word];
                    tspan = text.append("tspan").attr("x", -10).attr("y", y).attr("dy", ++lineNumber * lineHeight + dy + "em").text(word);
                }
            }
            // Adjust vertical centering of the wrapped text group
            const totalLines = lineNumber + 1;
            const yOffset = -(totalLines - 1) * lineHeight / 2;
            text.selectAll("tspan").attr("y", `${yOffset}em`);
        });
    }
</script>

</body>
</html>
